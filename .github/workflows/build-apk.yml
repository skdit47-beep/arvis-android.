
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.13-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Update Android Gradle Plugin
        run: sed -i 's/8.9.1/8.13.0/' jarvis/build.gradle.kts

      - name: Build APK
        run: cd jarvis && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
